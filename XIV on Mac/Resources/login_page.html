<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FINAL FANTASY XIV - 登入</title>
  <link rel="stylesheet" href="login_page.css" />
  <link rel="preconnect" href="https://www.google.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6Ld6VmorAAAAANQdQeqkaOeScR42qHC7Hyalq00r"></script>
  <script src="login_page.js"></script>
  
</head>
<body>
  <div class="container">
    <!-- 左側：新聞區域 (65%) -->
    <div class="news-section">
      <iframe id="newsFrame" 
              src="https://user-cdn.ffxiv.com.tw/news/251115/launcher_left.html"
              frameborder="0"
              allowtransparency="true"></iframe>
    </div>
    
    <!-- 右側：登入表單區域 (35%) -->
    <div class="login-section">
      <div class="login-form">
        <!-- 帳號輸入 -->
        <div class="form-group">
          <label for="username">Login Account</label>
          <div class="account-selector">
            <input type="text" 
                   id="username" 
                   placeholder="Please enter your login account"
                   autocomplete="username"
                   required />
            <button type="button" id="accountDropdownBtn" class="account-dropdown-btn" title="Select a saved account">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                <path d="M2 4L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="accountDropdown" class="account-dropdown" style="display:none;">
              <!-- 由 Swift 動態填入已儲存的帳號 -->
            </div>
          </div>
        </div>
        
        <!-- 密碼輸入 -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" 
                 id="password" 
                 placeholder="Please enter your password"
                 autocomplete="current-password"
                 required />
        </div>
        
        <!-- OTP 輸入框 -->
        <div class="form-group" id="otpGroup">
          <label for="otp">One-Time Password</label>
          <div class="otp-input-container">
            <input type="text" 
                   id="otp" 
                   placeholder="Please enter your OTP"
                   maxlength="6"
                   pattern="[0-9]{6}"
                   autocomplete="one-time-code" />
            <!-- 環形進度指示器 -->
            <div class="otp-timer-circle" id="otpTimerCircle">
              <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg"
                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                <path class="circle-progress" id="otpCircleProgress"
                    stroke-dasharray="0, 100"
                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                <text x="18" y="20.5" class="circle-text" id="otpRemainingTime">30</text>
              </svg>
            </div>
          </div>
        </div>
        
        <!-- 自動 OTP 核選框 -->
        <div class="form-group checkbox-group">
          <input type="checkbox" id="autoOTP" />
          <label for="autoOTP" class="checkbox-label">Auto-generate OTP</label>
        </div>
        
        <!-- OTP 金鑰輸入（展開式） -->
        <div class="form-group otp-key-group" id="otpKeyGroup" style="display:none;">
          <label for="otpKey">OTP Key</label>
          <input type="text" 
                 id="otpKey" 
                 placeholder="Please enter your Base32 format key" />
          <button type="button" id="confirmOtpKey" class="btn-secondary">Confirm Key</button>
        </div>
        
        <!-- 登入按鈕 -->
        <button type="button" id="loginButton" class="btn-primary">Login</button>
        
        <!-- reCAPTCHA 容器（隱藏） -->
        <div id="recaptchaContainer" style="display:none;"></div>
      </div>
    </div>
  </div>
  
</body>
</html>
